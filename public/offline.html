<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4eb" />
  <title>Sem Conexão • Caça aos Bugs</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .offline-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      position: relative;
      z-index: 10;
    }
    .offline-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .offline-practice-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: auto;
    }
    .offline-counter {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--bujo-blue-dark);
      background: #e0f2fe;
      border: 1.5px dashed var(--bujo-blue);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      display: inline-block;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="offline-practice-area" id="offlineArea"></div>

  <main class="offline-container">
    <div class="bujo-notebook-card offline-card">
      <div class="bujo-washi-tape washi-amber" aria-hidden="true"></div>

      <div class="bujo-top-header">
        <div class="bujo-stamp-badge pause-stamp">
          <svg class="ui-icon-large" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </div>
        <div class="bujo-page-tag">
          <span class="bujo-tag-bullet">✦</span> MODO OFFLINE <span class="bujo-tag-bullet">✦</span>
        </div>
      </div>

      <h1 class="bujo-main-title">
        <span class="bujo-highlight-marker marker-amber">Você está offline</span>
      </h1>
      <p class="bujo-subtitle">
        Não foi possível conectar ao servidor. Enquanto o sinal não volta, você pode treinar esmagando os bugs que surgem na folha!
      </p>

      <div class="offline-counter" id="offlineCounter">
        Bugs de treino esmagados: <strong id="offlineScore">0</strong>
      </div>

      <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
        <button class="btn btn-primary bujo-btn-stamp" id="btnRetry">
          <svg class="ui-icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Tentar Reconectar
        </button>
      </div>

      <div class="bujo-card-footer" aria-hidden="true" style="margin-top: 1.25rem;">
        <span>• BULLET JOURNAL OFFLINE •</span>
      </div>
    </div>
  </main>

  <script>
    let offlineScore = 0;
    const scoreEl = document.getElementById("offlineScore");
    const area = document.getElementById("offlineArea");
    const retryBtn = document.getElementById("btnRetry");

    function spawnOfflineBug() {
      const bug = document.createElement("div");
      bug.className = "bug";
      bug.style.position = "fixed";
      bug.style.left = Math.random() * (window.innerWidth - 60) + 10 + "px";
      bug.style.top = Math.random() * (window.innerHeight - 60) + 10 + "px";
      bug.style.cursor = "pointer";
      bug.style.zIndex = "5";
      bug.style.transition = "transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)";
      bug.innerHTML = `
        <div style="width: 44px; height: 44px; background: #0284c7; border: 2.5px solid #2e2823; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 #2e2823;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="14" x="8" y="6" rx="4" fill="#0369a1"/>
            <path d="m19 7-3 2M5 7 8 9M19 19l-3-2M5 19l3-2M20 13h-4M4 13h4M10 4l1 2M14 4l-1 2"/>
          </svg>
        </div>
      `;

      function smash(e) {
        e.stopPropagation();
        offlineScore++;
        scoreEl.textContent = offlineScore;
        if ("vibrate" in navigator) navigator.vibrate(25);
        bug.style.transform = "scale(0.1) rotate(45deg)";
        bug.style.opacity = "0";
        setTimeout(() => bug.remove(), 200);
      }

      bug.addEventListener("pointerdown", smash);
      area.appendChild(bug);

      setTimeout(() => {
        if (bug.parentElement) {
          bug.style.opacity = "0";
          setTimeout(() => bug.remove(), 300);
        }
      }, 4000);
    }

    setInterval(spawnOfflineBug, 1200);
    for (let i = 0; i < 3; i++) spawnOfflineBug();

    retryBtn.addEventListener("click", () => {
      window.location.href = "/";
    });

    window.addEventListener("online", () => {
      window.location.href = "/";
    });
  </script>
</body>
</html>
